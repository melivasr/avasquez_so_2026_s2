# RMS contra EDF: misma carga y First-Fit en ambas ejecuciones.
# Rutas relativas a host/ al ejecutar make host desde la raiz.
algorithm=RMS
heuristic=First-Fit
tick_us=10000
esp_port=/dev/ttyUSB0
pico_port=/dev/ttyACM0
report_ticks=10
missed_reports=3
timeout_ms=2000
duration_s=30
tasks=examples/edf_vs_rms.csv
output=report_experiment_rms
