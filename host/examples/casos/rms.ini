# Caso de prueba con tick de 200 ms. Ejecutar desde la raiz:
# make host CONFIG=examples/casos/rms.ini
algorithm=RMS
heuristic=First-Fit
tick_us=200000
esp_port=/dev/ttyUSB0
pico_port=/dev/ttyACM0
report_ticks=2
missed_reports=3
timeout_ms=2000
duration_s=60
tasks=examples/casos/rms_vs_edf.csv
output=report_caso_rms
