# Caso de prueba con tick de 200 ms. Ejecutar desde la raiz:
# make host CONFIG=examples/casos/worst_fit.ini
algorithm=EDF
heuristic=Worst-Fit
tick_us=200000
esp_port=/dev/ttyUSB0
pico_port=/dev/ttyACM0
report_ticks=2
missed_reports=3
timeout_ms=2000
duration_s=60
tasks=examples/casos/ff_vs_wf.csv
output=report_caso_worst_fit
